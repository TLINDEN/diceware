matrix:
  platform:
    - linux/amd64

labels:
  platform: ${platform}
    
steps:
  build-n-test:
    when:
      event: [push]
    image: alpine:latest
    commands:
      - apk update
      - apk add --no-cache bash build-base words-en gdb valgrind
      - make
      - valgrind --leak-check=full --show-reachable=yes ./dicepwgen
      #- gdb -batch -ex "run" -ex "bt" --args dicepwgen
      #- ./dicepwgen -y | grep -E '[a-z]*%'


